services:
  database:
    image: mysql:latest
    container_name: isdatabase
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: IS_database
      MYSQL_USER: user
      MYSQL_PASSWORD: ispass
    ports:
      - "3306:3306"
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: isphpmyadmin
    environment:
      PMA_HOST: isdatabase
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: pass
    ports:
      - "8080:80"
